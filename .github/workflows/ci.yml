name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: ci
      DEBUG: "false"
      # Valeur fictive, exclusivement destinée aux tests éphémères.
      JWT_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      SECRETS_ENCRYPTION_KEYS: '{"1":"abababababababababababababababababababababababababababababababab"}'
      SECRETS_ACTIVE_KEY_VERSION: "1"
      RATE_LIMIT_SECRET: "cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd"
      LOGIN_RATE_LIMIT_PER_IP: "100000"
      LOGIN_RATE_LIMIT_PER_ACCOUNT: "100000"
      REGISTER_RATE_LIMIT_PER_IP: "100000"
      DATABASE_URL: postgresql+asyncpg://securevault:ci_dev_only@127.0.0.1:5432/securevault
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: securevault
          POSTGRES_PASSWORD: ci_dev_only
          POSTGRES_DB: securevault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securevault -d securevault"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8@sha256:718f745deb7dfefeac6eed7041fc7ec9476b50e61b247932682457c41adafa0e
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -c constraints-runtime.txt -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: Tests
        run: python -m pytest
      - name: Alembic configuration
        run: |
          python -m alembic current
          python -m alembic check

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install security tools
        run: python -m pip install -c constraints-runtime.txt ".[security]"
      - name: Bandit visibility
        run: python -m bandit -r app --exit-zero
      - name: Bandit gate
        run: python -m bandit -r app --severity-level medium
      - name: Runtime dependency audit
        run: python -m pip_audit -r constraints-runtime.txt --no-deps --disable-pip --strict --progress-spinner off
      - name: Gitleaks full history
        run: >-
          docker run --rm
          --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --log-opts=--all --gitleaks-ignore-path=/repo/.gitleaksignore --redact=100 --no-banner

  image-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build runtime image and archive
        run: |
          docker build --pull -t securevault:ci .
          mkdir -p "$RUNNER_TEMP/trivy/cache"
          docker save -o "$RUNNER_TEMP/trivy/image.tar" securevault:ci
      - name: Trivy visibility without exceptions
        run: |
          docker run --rm \
            --mount "type=bind,source=$RUNNER_TEMP/trivy,target=/scan,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/trivy/cache,target=/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --input /scan/image.tar --scanners vuln \
            --severity HIGH,CRITICAL --exit-code 0 --format json --no-progress \
            > "$RUNNER_TEMP/trivy/visibility.json"
          python scripts/check_trivy_report.py "$RUNNER_TEMP/trivy/visibility.json"
      - name: Trivy gate with native expiring exceptions
        run: |
          docker run --rm \
            --mount "type=bind,source=$RUNNER_TEMP/trivy,target=/scan,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/trivy/cache,target=/root/.cache/trivy" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.trivyignore.yaml,target=/policy/.trivyignore.yaml,readonly" \
            "$TRIVY_IMAGE" image --input /scan/image.tar --scanners vuln \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress --skip-db-update \
            --ignorefile /policy/.trivyignore.yaml
