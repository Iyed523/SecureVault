[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securevault"
version = "0.1.0"
description = "Socle API REST de SecureVault, en développement."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic-settings==2.15.0",
    "SQLAlchemy[asyncio]==2.1.0",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "redis==8.1.0",
    "pwdlib[argon2]==0.3.1",
    "email-validator==2.3.0",
    "PyJWT==2.15.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx2==2.13.1", "ruff==0.16.9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: nécessite PostgreSQL 17 et Redis 8 réels"]
