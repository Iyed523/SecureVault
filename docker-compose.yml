name: securevault

services:
  api:
    build: .
    environment:
      APP_NAME: SecureVault
      APP_ENV: development
      DEBUG: "false"
      LOG_LEVEL: INFO
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to 64 hexadecimal characters}
      SECRETS_ENCRYPTION_KEYS: ${SECRETS_ENCRYPTION_KEYS:?Set SECRETS_ENCRYPTION_KEYS to a JSON keyring}
      SECRETS_ACTIVE_KEY_VERSION: ${SECRETS_ACTIVE_KEY_VERSION:-1}
      DATABASE_URL: postgresql+asyncpg://securevault:local_dev_only@postgres:5432/securevault
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: securevault
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: securevault
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8@sha256:718f745deb7dfefeac6eed7041fc7ec9476b50e61b247932682457c41adafa0e
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
